name: FoxPro to C# Conversion Pipeline

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'foxpro-source/**'

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.files.outputs.all }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Files
        id: files
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E 'foxpro-source/.*\.(prg|scx|frx|qpr|dbf)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "all=[]" >> $GITHUB_OUTPUT
          else
            FILES_JSON=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "all=$FILES_JSON" >> $GITHUB_OUTPUT
          fi

  convert-files:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_files != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        file: ${{ fromJson(needs.detect-changes.outputs.changed_files) }}
      max-parallel: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install openai==0.28.1 tiktoken jinja2

      - name: Convert FoxPro → C#
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os, json, openai
          from pathlib import Path

          openai.api_key = os.environ["OPENAI_API_KEY"]
          file_path = "${{ matrix.file }}"

          with open(file_path, "r", encoding="latin-1") as f:
              content = f.read()

          prompts = json.load(open("conversion-config/ai-prompts.json"))
          mappings = json.load(open("conversion-config/file-mappings.json"))

          file_type = Path(file_path).parent.name

          prompt = f"""{prompts['file_type_prompts'].get(file_type, '')}

          File: {file_path}

          ```foxpro
          {content[:12000]}
          ```
          """

          resp = openai.ChatCompletion.create(
              model="gpt-4o-mini",
              messages=[
                  {"role":"system","content":prompts["system_prompt"]},
                  {"role":"user","content":prompt}
              ],
              temperature=0.2,
              max_tokens=2000
          )

          code = resp.choices[0].message.content
          if "```csharp" in code:
              code = code.split("```csharp")[1].split("```")[0].strip()

          out_dir = mappings["directory_mappings"].get(file_type,"Banking.Core")
          out = f"csharp-translated/{out_dir}/{Path(file_path).stem}.cs"
          Path(out).parent.mkdir(parents=True, exist_ok=True)
          open(out,"w").write(code)
          PYTHON_SCRIPT

      - name: Commit generated code
        run: |
          git config user.name "AI Converter Bot"
          git config user.email "ai-bot@banking.local"
          git checkout -B csharp-translated
          git add csharp-translated
          git commit -m "AI Conversion: ${{ matrix.file }}" || true
          git push origin csharp-translated --force

  compile-and-test:
    needs: convert-files
    runs-on:
      - self-hosted
      - windows
      - dotnet

    steps:
      - uses: actions/checkout@v4
        with:
          ref: csharp-translated

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create solution & projects
        shell: powershell
        run: |
          dotnet new sln -n BankingSystem

          $projects = @(
            @{Name="Banking.Core"; Type="classlib"},
            @{Name="Banking.Forms"; Type="winforms"},
            @{Name="Banking.Reports"; Type="classlib"},
            @{Name="Banking.Data"; Type="classlib"}
          )

          foreach ($p in $projects) {
            $src="csharp-translated/$($p.Name)"
            if (Test-Path $src) {
              dotnet new $($p.Type) -n $($p.Name) -o $($p.Name)
              dotnet sln add "$($p.Name)/$($p.Name).csproj"
              Copy-Item "$src/*.cs" "$($p.Name)/" -Force
            }
          }

          if (Test-Path Banking.Forms/Banking.Forms.csproj -and Test-Path Banking.Core/Banking.Core.csproj) {
            dotnet add Banking.Forms/Banking.Forms.csproj reference Banking.Core/Banking.Core.csproj
          }

          if (Test-Path Banking.Reports/Banking.Reports.csproj -and Test-Path Banking.Data/Banking.Data.csproj) {
            dotnet add Banking.Reports/Banking.Reports.csproj reference Banking.Data/Banking.Data.csproj
          }

      - name: Restore
        run: dotnet restore

      - name: Build
        continue-on-error: true
        run: dotnet build --configuration Release > build_output.txt 2>&1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_output.txt
